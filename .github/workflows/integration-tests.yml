name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public app URL, for example http://<load-balancer-ip>"
        required: true
        type: string
  workflow_call:
    inputs:
      app_url:
        description: "Public app URL, for example http://<load-balancer-ip>"
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  INTEGRATION_STATE_FILE: .integration-test-state.json

jobs:
  integration_tests:
    name: Public App Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx google-cloud-firestore google-cloud-storage

      - name: Run integration tests
        env:
          APP_URL: ${{ inputs.app_url }}
          TEST_EMAIL: integration-${{ github.run_id }}-${{ github.run_attempt }}@example.com
          TEST_PASSWORD: integration-${{ github.run_id }}-${{ github.run_attempt }}-password
        run: pytest integration_tests -v

      - name: Cleanup integration test Firestore data
        if: always()
        env:
          TEST_EMAIL: integration-${{ github.run_id }}-${{ github.run_attempt }}@example.com
        run: python integration_tests/cleanup.py

      - name: Write summary
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" << SUMMARY
          ## Integration test run

          App URL:

          \`${{ inputs.app_url }}\`

          Test user:

          \`integration-${{ github.run_id }}-${{ github.run_attempt }}@example.com\`

          Cleanup step was executed with \`if: always()\`.
          SUMMARY
