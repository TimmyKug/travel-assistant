name: Deploy Travel Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
  TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Tests ────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
          cd backend
          pytest tests/ -v

      # ── GCP Auth ────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          REGION="${{ vars.GCP_REGION || 'europe-west3' }}"
          if ! gsutil ls -b "gs://${BUCKET}" > /dev/null 2>&1; then
            echo "Bucket ${BUCKET} not found — creating..."
            gsutil mb -l "${REGION}" -p "${{ vars.GCP_PROJECT_ID }}" "gs://${BUCKET}"
            gsutil versioning set on "gs://${BUCKET}"
            echo "Bucket created."
          else
            echo "Bucket ${BUCKET} already exists — skipping."
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Import or fix Firestore database state
        working-directory: terraform
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"

          # Check if Firestore is in state
          if terraform state list google_firestore_database.travel_db 2>/dev/null | grep -q "google_firestore_database.travel_db"; then
            # In state — check if location is correct
            LOCATION=$(terraform state show google_firestore_database.travel_db 2>/dev/null | grep location_id | awk '{print $3}' | tr -d '"')
            if [ -n "$LOCATION" ] && [ "$LOCATION" != "eur3" ]; then
              echo "Firestore in state has wrong location ($LOCATION) — removing from state for re-import..."
              terraform state rm google_firestore_database.travel_db
            fi
          fi

          # Check if Firestore exists in GCP but not in state, then import
          if ! terraform state list google_firestore_database.travel_db 2>/dev/null | grep -q "google_firestore_database.travel_db"; then
            if gcloud firestore databases list --project="${PROJECT_ID}" --filter='name:(default)' --format='value(name)' 2>/dev/null | grep -q "(default)"; then
              echo "Firestore database exists in GCP but not in state — importing..."
              terraform import google_firestore_database.travel_db "projects/${PROJECT_ID}/databases/(default)" || true
            fi
          fi

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ── Resolve infrastructure outputs ───────────────────────────────
      - name: Get infrastructure outputs
        id: infra
        working-directory: terraform
        run: |
          echo "monitoring_ip=$(terraform output -raw monitoring_vm_external_ip)" >> $GITHUB_OUTPUT
          echo "monitoring_internal_ip=$(terraform output -raw monitoring_vm_internal_ip)" >> $GITHUB_OUTPUT
          echo "config_bucket=$(terraform output -raw config_bucket_name)" >> $GITHUB_OUTPUT

      # ── Docker build & push to Artifact Registry ────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/backend:${{ github.sha }}
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/nginx:${{ github.sha }}
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/nginx:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.GCP_PROJECT_ID }}.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      # ── Upload app configs and .env to GCS ──────────────────────────
      # The startup script pulls these when the MIG boots a replacement VM.
      # .env is rendered here from GitHub secrets so the startup script has
      # everything it needs for a self-contained recovery — no Secret Manager.
      - name: Upload app configs to GCS
        run: |
          BUCKET="${{ steps.infra.outputs.config_bucket }}"
          MONITORING_IP="${{ steps.infra.outputs.monitoring_internal_ip }}"

          # Render .env in the same format as the Ansible template
          cat > /tmp/app.env << ENV
          GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          LOKI_URL=http://$${MONITORING_IP}:3100/loki/api/v1/push
          IMAGE_TAG=${{ github.sha }}
          ENV

          gsutil cp docker-compose.yml                      "gs://$BUCKET/docker-compose.yml"
          gsutil cp monitoring/promtail/promtail.yml        "gs://$BUCKET/monitoring/promtail/promtail.yml"
          gsutil cp /tmp/app.env                            "gs://$BUCKET/.env"

      - name: Terraform Apply App Rollout
        working-directory: terraform
        env:
          TF_VAR_app_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve

      # ── Ansible ─────────────────────────────────────────────────────
      - name: Install Ansible
        run: pip install ansible==9.3.0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.infra.outputs.monitoring_ip }} >> ~/.ssh/known_hosts

      - name: Wait for VMs to be ready
        run: |
          HOST="${{ steps.infra.outputs.monitoring_ip }}"
          echo "Waiting for SSH on $HOST..."
          for i in $(seq 1 20); do
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              deploy@${HOST} "echo ready" && break
            echo "Attempt $i failed, retrying in 15 s..."
            sleep 15
          done

      - name: Write Ansible inventory
        run: |
          cat > ansible/inventory.yml << EOF
          all:
            children:
              monitoring:
                hosts:
                  monitoring-vm:
                    ansible_host: ${{ steps.infra.outputs.monitoring_ip }}
                    ansible_user: deploy
                    ansible_ssh_private_key_file: ~/.ssh/deploy_key
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          EOF

      - name: Write monitoring secrets to Ansible vars
        run: |
          cat > ansible/secrets.yml << 'EOF'
          grafana_admin_password: "${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          prometheus_htpasswd: "${{ secrets.PROMETHEUS_HTPASSWD }}"
          gcp_project_id: "${{ vars.GCP_PROJECT_ID }}"
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yml playbook.yml \
            --extra-vars "@secrets.yml" \
            --extra-vars "app_dir=/opt/travel-assistant" \
            --extra-vars "repo_local_path=${{ github.workspace }}" \
            --extra-vars "zone=${{ vars.GCP_REGION || 'europe-west3' }}-a"
