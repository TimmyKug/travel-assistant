name: Deploy Travel Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
  TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Tests ────────────────────────────────────────────────────────
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run backend tests
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-test.txt
          cd backend
          pytest tests/ -v

      # ── GCP Auth ────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          REGION="${{ vars.GCP_REGION || 'europe-west3' }}"
          if ! gsutil ls -b "gs://${BUCKET}" > /dev/null 2>&1; then
            echo "Bucket ${BUCKET} not found — creating..."
            gsutil mb -l "${REGION}" -p "${{ vars.GCP_PROJECT_ID }}" "gs://${BUCKET}"
            gsutil versioning set on "gs://${BUCKET}"
            echo "Bucket created."
          else
            echo "Bucket ${BUCKET} already exists — skipping."
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Remove Firestore from state if location is wrong
        working-directory: terraform
        run: |
          # One-time fix: if the DB is in state with the wrong location, drop it
          # so Terraform recreates it. Safe because deletion_policy = ABANDON.
          LOCATION=$(terraform state show google_firestore_database.travel_db 2>/dev/null | grep location_id | awk '{print $3}' | tr -d '"')
          if [ -n "$LOCATION" ] && [ "$LOCATION" != "eur3" ]; then
            echo "Firestore in state has wrong location ($LOCATION) — removing from state..."
            terraform state rm google_firestore_database.travel_db
          fi

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      # ── Docker build & push to Artifact Registry ────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/backend:${{ github.sha }}
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/nginx:${{ github.sha }}
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/nginx:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.GCP_PROJECT_ID }}.firebaseapp.com
            VITE_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      # ── Resolve VM IPs from Terraform outputs ───────────────────────
      - name: Get VM IPs
        id: get_ips
        working-directory: terraform
        run: |
          echo "app_vm_ip=$(terraform output -raw vm_external_ip)" >> $GITHUB_OUTPUT
          echo "app_vm_internal_ip=$(terraform output -raw vm_internal_ip)" >> $GITHUB_OUTPUT
          echo "monitoring_vm_ip=$(terraform output -raw monitoring_vm_external_ip)" >> $GITHUB_OUTPUT
          echo "monitoring_vm_internal_ip=$(terraform output -raw monitoring_vm_internal_ip)" >> $GITHUB_OUTPUT

      # ── Ansible ─────────────────────────────────────────────────────
      - name: Install Ansible
        run: pip install ansible==9.3.0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.get_ips.outputs.app_vm_ip }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ steps.get_ips.outputs.monitoring_vm_ip }} >> ~/.ssh/known_hosts

      - name: Wait for VMs to be ready
        run: |
          for HOST in ${{ steps.get_ips.outputs.app_vm_ip }} ${{ steps.get_ips.outputs.monitoring_vm_ip }}; do
            for i in $(seq 1 20); do
              ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
                deploy@${HOST} "echo ready" && break
              echo "Attempt $i for ${HOST} failed, waiting 15s..."
              sleep 15
            done
          done

      - name: Write Ansible inventory
        run: |
          cat > ansible/inventory.yml << EOF
          all:
            children:
              app:
                hosts:
                  travel-vm:
                    ansible_host: ${{ steps.get_ips.outputs.app_vm_ip }}
                    ansible_user: deploy
                    ansible_ssh_private_key_file: ~/.ssh/deploy_key
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
              monitoring:
                hosts:
                  monitoring-vm:
                    ansible_host: ${{ steps.get_ips.outputs.monitoring_vm_ip }}
                    ansible_user: deploy
                    ansible_ssh_private_key_file: ~/.ssh/deploy_key
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          EOF

      - name: Write app secrets to Ansible vars
        run: |
          cat > ansible/secrets.yml << 'EOF'
          jwt_secret_key: "${{ secrets.JWT_SECRET_KEY }}"
          gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
          grafana_admin_password: "${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          prometheus_htpasswd: "${{ secrets.PROMETHEUS_HTPASSWD }}"
          gcp_project_id: "${{ vars.GCP_PROJECT_ID }}"
          firebase_app_id: "${{ vars.FIREBASE_APP_ID }}"
          gcp_sa_key_json: '${{ secrets.GCP_SA_KEY }}'
          vite_firebase_api_key: "${{ secrets.FIREBASE_API_KEY }}"
          vite_firebase_storage_bucket: "${{ vars.FIREBASE_STORAGE_BUCKET }}"
          vite_firebase_messaging_sender_id: "${{ vars.FIREBASE_MESSAGING_SENDER_ID }}"
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yml playbook.yml \
            --extra-vars "@secrets.yml" \
            --extra-vars "app_dir=/opt/travel-assistant" \
            --extra-vars "repo_local_path=${{ github.workspace }}" \
            --extra-vars "image_tag=${{ github.sha }}" \
            --extra-vars "app_vm_internal_ip=${{ steps.get_ips.outputs.app_vm_internal_ip }}" \
            --extra-vars "monitoring_vm_internal_ip=${{ steps.get_ips.outputs.monitoring_vm_internal_ip }}"
