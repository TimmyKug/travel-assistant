name: Deploy Travel Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
  TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}

jobs:
  # ── Parallel: checks, build, provision ────────────────────────────────

  backend_checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt ruff==0.8.4 pip-audit==2.7.3

      - name: Ruff check
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Mypy
        working-directory: backend
        run: mypy .

      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest tests/

  frontend_checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  build:
    name: Build ${{ matrix.image.name }}
    needs: [provision]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        image:
          - name: backend
            context: ./backend
            dockerfile: backend/Dockerfile
          - name: nginx
            context: .
            dockerfile: nginx/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/${{ matrix.image.name }}:${{ github.sha }}
            ${{ vars.GCP_REGION || 'europe-west3' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/travel-assistant/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      monitoring_ip: ${{ steps.infra.outputs.monitoring_ip }}
      monitoring_internal_ip: ${{ steps.infra.outputs.monitoring_internal_ip }}
      config_bucket: ${{ steps.infra.outputs.config_bucket }}
      app_static_ip: ${{ steps.infra.outputs.app_static_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure required project APIs are enabled
        run: |
          gcloud services enable \
            cloudresourcemanager.googleapis.com \
            serviceusage.googleapis.com \
            compute.googleapis.com \
            firestore.googleapis.com \
            iam.googleapis.com \
            artifactregistry.googleapis.com \
            cloudscheduler.googleapis.com \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          REGION="${{ vars.GCP_REGION || 'europe-west3' }}"
          if ! gsutil ls -b "gs://${BUCKET}" > /dev/null 2>&1; then
            echo "Bucket ${BUCKET} not found — creating..."
            gsutil mb -l "${REGION}" -p "${{ vars.GCP_PROJECT_ID }}" "gs://${BUCKET}"
            gsutil versioning set on "gs://${BUCKET}"
            echo "Bucket created."
          else
            echo "Bucket ${BUCKET} already exists — skipping."
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Import or fix Firestore database state
        working-directory: terraform
        run: |
          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"

          # Check if Firestore is in state
          if terraform state list google_firestore_database.travel_db 2>/dev/null | grep -q "google_firestore_database.travel_db"; then
            # In state — check if location is correct
            LOCATION=$(terraform state show google_firestore_database.travel_db 2>/dev/null | grep location_id | awk '{print $3}' | tr -d '"')
            if [ -n "$LOCATION" ] && [ "$LOCATION" != "eur3" ]; then
              echo "Firestore in state has wrong location ($LOCATION) — removing from state for re-import..."
              terraform state rm google_firestore_database.travel_db
            fi
          fi

          # If Firestore default DB exists in GCP but is not in Terraform state, import it.
          if ! terraform state list google_firestore_database.travel_db 2>/dev/null | grep -q "google_firestore_database.travel_db"; then
            if gcloud firestore databases list --project="${PROJECT_ID}" --format='value(name)' | grep -q "(default)"; then
              echo "Firestore default DB exists in GCP; importing into Terraform state..."
              terraform import google_firestore_database.travel_db "projects/${PROJECT_ID}/databases/(default)"

              # Verify import actually landed in state; fail early with clear error otherwise.
              if ! terraform state list google_firestore_database.travel_db 2>/dev/null | grep -q "google_firestore_database.travel_db"; then
                echo "ERROR: Firestore import reported success path but resource is still not in Terraform state."
                exit 1
              fi
            else
              echo "No existing Firestore default DB found in GCP; Terraform will create it."
            fi
          fi

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Install Firestore client for sentinel seeding
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-firestore

      - name: Seed Firestore sentinel documents
        run: |
          bash scripts/seed-sentinel-data.sh "${{ vars.GCP_PROJECT_ID }}"

      - name: Get infrastructure outputs
        id: infra
        working-directory: terraform
        run: |
          echo "monitoring_ip=$(terraform output -raw monitoring_vm_external_ip)" >> $GITHUB_OUTPUT
          echo "monitoring_internal_ip=$(terraform output -raw monitoring_vm_internal_ip)" >> $GITHUB_OUTPUT
          echo "config_bucket=$(terraform output -raw config_bucket_name)" >> $GITHUB_OUTPUT
          echo "app_static_ip=$(terraform output -raw app_static_ip)" >> $GITHUB_OUTPUT

  # ── Parallel: app rollout + monitoring config (after checks/build/provision) ──

  deploy_app:
    name: Deploy App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [backend_checks, frontend_checks, build, provision]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Push runtime secrets to Secret Manager ───────────────────────
      # App VMs fetch these at startup via the `secretAccessor` binding set in
      # Terraform, so the .env in GCS stays free of plaintext secrets.
      - name: Sync runtime secrets to Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add gemini-api-key --data-file=-
          printf '%s' "$JWT_SECRET_KEY" | gcloud secrets versions add jwt-secret-key --data-file=-

      # ── Upload app configs and .env to GCS ──────────────────────────
      - name: Upload app configs to GCS
        run: |
          BUCKET="${{ needs.provision.outputs.config_bucket }}"
          MONITORING_IP="${{ needs.provision.outputs.monitoring_internal_ip }}"

          # Non-secret runtime config only — GEMINI_API_KEY and JWT_SECRET_KEY
          # are fetched from Secret Manager by the VM startup script.
          cat > /tmp/app.env << ENV
          GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
          LOKI_URL=http://${MONITORING_IP}:3100/loki/api/v1/push
          IMAGE_TAG=${{ github.sha }}
          ENV

          gsutil cp docker-compose.yml                      "gs://$BUCKET/docker-compose.yml"
          gsutil cp monitoring/promtail/promtail.yml        "gs://$BUCKET/monitoring/promtail/promtail.yml"
          gsutil cp /tmp/app.env                            "gs://$BUCKET/.env"

      # ── Terraform rollout (updates instance template with new image tag) ─
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('terraform/**/*.tf') }}
          restore-keys: terraform-${{ runner.os }}-

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Terraform Apply App Rollout
        working-directory: terraform
        env:
          TF_VAR_app_image_tag: ${{ github.sha }}
        run: terraform apply -auto-approve

  deploy_monitoring:
    name: Deploy Monitoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend_checks, frontend_checks, build, provision]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible==9.3.0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ needs.provision.outputs.monitoring_ip }} >> ~/.ssh/known_hosts

      - name: Wait for VMs to be ready
        run: |
          HOST="${{ needs.provision.outputs.monitoring_ip }}"
          echo "Waiting for SSH on $HOST..."
          for i in $(seq 1 60); do
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              deploy@${HOST} "echo ready" && break
            echo "Attempt $i failed, retrying in 5 s..."
            sleep 5
          done

      - name: Write Ansible inventory
        run: |
          cat > ansible/inventory.yml << EOF
          all:
            children:
              monitoring:
                hosts:
                  monitoring-vm:
                    ansible_host: ${{ needs.provision.outputs.monitoring_ip }}
                    ansible_user: deploy
                    ansible_ssh_private_key_file: ~/.ssh/deploy_key
                    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          EOF

      - name: Write monitoring secrets to Ansible vars
        run: |
          cat > ansible/secrets.yml << 'EOF'
          grafana_admin_password: "${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          prometheus_htpasswd: "${{ secrets.PROMETHEUS_HTPASSWD }}"
          gcp_project_id: "${{ vars.GCP_PROJECT_ID }}"
          smtp_smarthost: "${{ vars.SMTP_SMARTHOST }}"
          smtp_from: "${{ vars.SMTP_FROM }}"
          smtp_auth_username: "${{ vars.SMTP_AUTH_USERNAME }}"
          smtp_auth_password: "${{ secrets.SMTP_AUTH_PASSWORD }}"
          alert_email_to: "${{ vars.ALERT_EMAIL_TO }}"
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yml playbook.yml \
            --extra-vars "@secrets.yml" \
            --extra-vars "app_dir=/opt/travel-assistant" \
            --extra-vars "repo_local_path=${{ github.workspace }}" \
            --extra-vars "zone=${{ vars.GCP_REGION || 'europe-west3' }}-a" \
            --extra-vars "app_static_ip=${{ needs.provision.outputs.app_static_ip }}"

  verify:
    name: Verify Deployment
    needs: [deploy_app, deploy_monitoring, provision]
    uses: ./.github/workflows/integration-tests.yml
    with:
      app_url: http://${{ needs.provision.outputs.app_static_ip }}
    secrets: inherit
