name: Deploy Travel Assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
  TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}

jobs:
  deploy:
    name: Provision & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── GCP Auth ────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Ensure Terraform state bucket exists
        run: |
          BUCKET="${{ vars.TF_STATE_BUCKET }}"
          REGION="${{ vars.GCP_REGION || 'europe-west3' }}"
          if ! gsutil ls -b "gs://${BUCKET}" > /dev/null 2>&1; then
            echo "Bucket ${BUCKET} not found — creating..."
            gsutil mb -l "${REGION}" -p "${{ vars.GCP_PROJECT_ID }}" "gs://${BUCKET}"
            gsutil versioning set on "gs://${BUCKET}"
            echo "Bucket created."
          else
            echo "Bucket ${BUCKET} already exists — skipping."
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get VM IP
        id: get_ip
        working-directory: terraform
        run: echo "vm_ip=$(terraform output -raw vm_external_ip)" >> $GITHUB_OUTPUT

      # ── Ansible ─────────────────────────────────────────────────────
      - name: Install Ansible
        run: pip install ansible==9.3.0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.get_ip.outputs.vm_ip }} >> ~/.ssh/known_hosts

      - name: Wait for VM SSH to be ready
        run: |
          for i in $(seq 1 20); do
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              deploy@${{ steps.get_ip.outputs.vm_ip }} "echo ready" && break
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done

      - name: Write Ansible inventory
        run: |
          cat > ansible/inventory.yml << EOF
          all:
            hosts:
              travel-vm:
                ansible_host: ${{ steps.get_ip.outputs.vm_ip }}
                ansible_user: deploy
                ansible_ssh_private_key_file: ~/.ssh/deploy_key
                ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          EOF

      - name: Write app secrets to Ansible vars
        run: |
          cat > ansible/secrets.yml << EOF
          gemini_api_key: "${{ secrets.GEMINI_API_KEY }}"
          grafana_admin_password: "${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
          gcp_project_id: "${{ vars.GCP_PROJECT_ID }}"
          firebase_app_id: "${{ vars.FIREBASE_APP_ID }}"
          gcp_sa_key_json: '${{ secrets.GCP_SA_KEY }}'
          EOF

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.yml playbook.yml \
            --extra-vars "@secrets.yml" \
            --extra-vars "app_dir=/opt/travel-assistant" \
            --extra-vars "repo_local_path=${{ github.workspace }}"
