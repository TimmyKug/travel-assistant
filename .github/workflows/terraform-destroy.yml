name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm infrastructure destruction'
        required: true
        type: string

jobs:
  terraform_destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "destroy" ]; then
            echo "❌ Destruction cancelled: confirmation not provided"
            exit 1
          fi
          echo "✅ Destruction confirmed"

      - name: Checkout repository
        uses: actions/checkout@v4

      # ── GCP Auth ────────────────────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # ── Terraform ───────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
          TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=travel-assistant/state"

      - name: Terraform Plan (Destroy)
        id: plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
          TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION || 'europe-west3' }}
          TF_VAR_zone: "${{ vars.GCP_REGION || 'europe-west3' }}-a"
          TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
          TF_VAR_firebase_app_id: ${{ vars.FIREBASE_APP_ID }}
        run: terraform destroy -auto-approve -var-file="terraform.tfvars" || true
