services:

  backend:
    build: ./backend
    image: europe-west3-docker.pkg.dev/${GCP_PROJECT_ID}/travel-assistant/backend:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    expose:
      - "8000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx builds the React app in a multi-stage Dockerfile
  # then serves the static files and proxies /api to backend
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: europe-west3-docker.pkg.dev/${GCP_PROJECT_ID}/travel-assistant/nginx:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/prometheus.htpasswd:/etc/nginx/prometheus.htpasswd:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
