---
- name: Configure Travel Assistant VM
  hosts: all
  become: true

  vars:
    app_dir: /opt/travel-assistant
    monitoring_mount: /mnt/monitoring

  pre_tasks:
    - name: Check if monitoring disk is formatted
      command: blkid /dev/disk/by-id/google-monitoring-disk
      register: disk_check
      failed_when: false
      changed_when: false

    - name: Format monitoring disk (first run only)
      filesystem:
        fstype: ext4
        dev: /dev/disk/by-id/google-monitoring-disk
      when: disk_check.rc != 0

    - name: Create monitoring mount point
      file:
        path: "{{ monitoring_mount }}"
        state: directory
        mode: "0755"

    - name: Mount monitoring disk (persists across reboots)
      mount:
        path: "{{ monitoring_mount }}"
        src: /dev/disk/by-id/google-monitoring-disk
        fstype: ext4
        opts: defaults,nofail
        state: mounted

  roles:
    - role: common
    - role: monitoring
    - role: app
