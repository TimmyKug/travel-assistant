---
- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

- name: Sync application code from CI runner
  synchronize:
    src: "{{ repo_local_path }}/"
    dest: "{{ app_dir }}/"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=__pycache__"
      - "--exclude=.terraform"
      - "--exclude=.terraform.lock.hcl"
      - "--exclude=ansible/secrets.yml"
      - "--exclude=ansible/inventory.yml"
      - "--exclude=nginx/prometheus.htpasswd"

- name: Write monitoring env file
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: deploy
    group: deploy
    mode: "0600"

- name: Render Prometheus config for monitoring VM
  template:
    src: prometheus.yml.j2
    dest: "{{ app_dir }}/monitoring/prometheus/prometheus.yml"
    owner: deploy
    group: deploy
    mode: "0644"

- name: Install docker compose plugin for community.docker
  apt:
    name: python3-docker
    state: present

- name: Pull and start monitoring services
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - docker-compose.monitoring.yml
    build: never
    pull: missing
    state: present
    recreate: always
  environment:
    MONITORING_MOUNT: "{{ monitoring_mount }}"
