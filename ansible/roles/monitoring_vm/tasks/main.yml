---
- name: Create app directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

- name: Sync application code from CI runner
  synchronize:
    src: "{{ repo_local_path }}/"
    dest: "{{ app_dir }}/"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=__pycache__"
      - "--exclude=.terraform"
      - "--exclude=.terraform.lock.hcl"
      - "--exclude=ansible/secrets.yml"
      - "--exclude=ansible/inventory.yml"

- name: Write monitoring .env file
  template:
    src: env.j2
    dest: "{{ app_dir }}/monitoring/.env"
    owner: deploy
    group: deploy
    mode: "0600"

- name: Template Prometheus config (GCE SD discovers app VM automatically)
  template:
    src: prometheus.yml.j2
    dest: "{{ app_dir }}/monitoring/prometheus.yml"
    owner: deploy
    group: deploy
    mode: "0644"

- name: Write Prometheus htpasswd file
  copy:
    content: "{{ prometheus_htpasswd }}"
    dest: "{{ app_dir }}/monitoring/prometheus.htpasswd"
    owner: deploy
    group: deploy
    mode: "0644"

- name: Install docker compose plugin for community.docker
  apt:
    name: python3-docker
    state: present

- name: Pull and start all monitoring services
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/monitoring"
    build: never
    pull: missing
    state: present
    recreate: always
  environment:
    MONITORING_MOUNT: "{{ monitoring_mount }}"
