# ansible/inventory.ini
# Replace APP_VM_EXTERNAL_IP and MONITORING_VM_EXTERNAL_IP with Terraform outputs.

[app]
travel-app-vm ansible_host=APP_VM_EXTERNAL_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[monitoring]
travel-monitoring-vm ansible_host=MONITORING_VM_EXTERNAL_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
