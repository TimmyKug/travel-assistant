---
- name: Provision App VM
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/travel-assistant
    # monitoring_mount intentionally absent — the app VM has no monitoring disk

  roles:
    - role: common
    - role: app
    - role: nginx

- name: Provision Monitoring VM
  hosts: monitoring
  become: true
  gather_facts: true

  vars:
    app_dir: /opt/travel-assistant
    monitoring_mount: /mnt/monitoring-data
    monitoring_device: /dev/disk/by-id/google-monitoring-data

  roles:
    - role: common
    - role: monitoring_disk
    - role: monitoring_vm
