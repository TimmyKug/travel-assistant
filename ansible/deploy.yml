---
# ============================================================
#  Travel Assistant — Schneller Redeploy-Playbook
#
#  Wird von GitHub Actions aufgerufen. Macht NUR:
#    1. Neue App-Dateien auf die VM kopieren
#    2. Python-Abhängigkeiten aktualisieren (falls requirements.txt geändert)
#    3. Gunicorn-Service neu starten
#    4. Health-Check
#
#  Die .env auf der VM bleibt UNBERÜHRT — Secrets werden dort
#  beim ersten Setup (playbook.yml) gesetzt und nie überschrieben.
# ============================================================
- name: Travel Assistant — App Redeploy
  hosts: travel_assistant
  become: true
  gather_facts: false          # Schneller: keine System-Facts nötig

  vars:
    app_dir: /opt/travel-assistant

  tasks:

    # ── .env aktualisieren (Secrets aus GitHub Actions Umgebungsvariablen) ──
    # Nur Zeilen überschreiben die sich geändert haben — alle anderen Werte bleiben.
    - name: Gemini API Key in .env setzen
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^GEMINI_API_KEY="
        line: "GEMINI_API_KEY={{ lookup('env', 'GEMINI_API_KEY') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      register: env_gemini_changed
      no_log: true   # Secret nicht in Ansible-Logs ausgeben

    - name: GCP Project ID in .env setzen
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^GOOGLE_CLOUD_PROJECT="
        line: "GOOGLE_CLOUD_PROJECT={{ lookup('env', 'GCP_PROJECT_ID') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      register: env_project_changed

    - name: Firebase Web API Key in .env setzen
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^FIREBASE_WEB_API_KEY="
        line: "FIREBASE_WEB_API_KEY={{ lookup('env', 'FIREBASE_WEB_API_KEY') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      register: env_firebase_key_changed
      no_log: true

    - name: Firebase App ID in .env setzen
      lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^FIREBASE_APP_ID="
        line: "FIREBASE_APP_ID={{ lookup('env', 'FIREBASE_APP_ID') }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
      register: env_firebase_app_changed

    # ── App-Dateien synchronisieren ────────────────────────────────────────
    - name: App-Python-Datei aktualisieren
      copy:
        src: ../app/app.py
        dest: "{{ app_dir }}/app.py"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: app_py_changed

    - name: Requirements aktualisieren
      copy:
        src: ../app/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: requirements_changed

    - name: HTML-Templates synchronisieren
      copy:
        src: ../app/templates/
        dest: "{{ app_dir }}/templates/"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: templates_changed

    # ── Python-Abhängigkeiten neu installieren (nur wenn requirements.txt sich geändert hat) ──
    - name: Python-Abhängigkeiten installieren
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
      become_user: ubuntu
      when: requirements_changed.changed

    # ── Service neu starten (nur wenn sich etwas geändert hat) ────────────
    - name: Alle alten Gunicorn-Prozesse beenden
      command: pkill -f gunicorn
      failed_when: false   # kein Fehler wenn nichts läuft
      when: >
        app_py_changed.changed or
        requirements_changed.changed or
        templates_changed.changed or
        env_gemini_changed.changed or
        env_project_changed.changed or
        env_firebase_key_changed.changed or
        env_firebase_app_changed.changed

    - name: Kurz warten bis Ports frei sind
      pause:
        seconds: 3
      when: >
        app_py_changed.changed or
        requirements_changed.changed or
        templates_changed.changed or
        env_gemini_changed.changed or
        env_project_changed.changed or
        env_firebase_key_changed.changed or
        env_firebase_app_changed.changed

    - name: Gunicorn-Service neu starten
      systemd:
        name: travel-assistant
        state: restarted
        daemon_reload: false
      when: >
        app_py_changed.changed or
        requirements_changed.changed or
        templates_changed.changed or
        env_gemini_changed.changed or
        env_project_changed.changed or
        env_firebase_key_changed.changed or
        env_firebase_app_changed.changed

    # ── Health-Check ───────────────────────────────────────────────────────
    - name: Warten bis App wieder antwortet
      uri:
        url: "http://localhost:5000/health"
        status_code: 200
      retries: 12
      delay: 5
      register: health
      until: health.status == 200

    - name: Deploy-Zusammenfassung
      debug:
        msg:
          - "✅ Redeploy abgeschlossen!"
          - "app.py geändert:          {{ app_py_changed.changed }}"
          - "requirements.txt geändert: {{ requirements_changed.changed }}"
          - "Templates geändert:        {{ templates_changed.changed }}"
