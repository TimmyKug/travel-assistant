server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # React SPA — serve index.html for all unmatched routes
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Prometheus metrics endpoint (proxied from FastAPI)
    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }

    # Grafana — sub-path proxy (Grafana handles its own auth)
    location /grafana/ {
        proxy_pass         http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Prometheus — sub-path proxy with basic auth (Prometheus has no built-in auth)
    location /prometheus/ {
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/prometheus.htpasswd;

        proxy_pass         http://prometheus:9090/prometheus/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
