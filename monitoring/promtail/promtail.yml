server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # LOKI_URL is injected via the app VM's .env (e.g. http://10.x.x.x:3100/loki/api/v1/push)
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use the container name as the "service" label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: service
      # Keep only containers in this compose project
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        action: keep
        regex: travel-assistant
    pipeline_stages:
      # Parse JSON log lines emitted by the backend
      - json:
          expressions:
            level: level
            logger: logger
            message: message
      # Promote level to a Loki label so you can filter by it
      - labels:
          level:
          logger:

  - job_name: startup-log
    static_configs:
      - targets: [localhost]
        labels:
          job: startup-log
          service: vm-startup
          __path__: /var/log/startup.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            reason: reason
            message: message
            instance: instance
      - labels:
          level:
          event:
          reason:
          instance:
