global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: travel-assistant

# ── Alerting (optional — wire up Alertmanager here) ──────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Scrape Configs ────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics via Node Exporter
  - job_name: node_exporter
    static_configs:
      - targets: ['host.docker.internal:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: travel-vm

  # Flask app custom metrics
  - job_name: travel_assistant_app
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: travel-assistant-app

  # Grafana self-monitoring (optional)
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
