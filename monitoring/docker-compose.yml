services:

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prometheus.htpasswd:/etc/nginx/prometheus.htpasswd:ro
    depends_on:
      - grafana
      - prometheus
      - alertmanager
    networks:
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertmanager/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${MONITORING_MOUNT}/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    expose:
      - "9090"
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${MONITORING_MOUNT}/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      # No --web.external-url: AM requires an absolute URL and we don't have a
      # stable hostname. nginx strips the /alertmanager/ prefix via proxy_pass,
      # so AM can keep serving from / with the default route prefix.
    expose:
      - "9093"
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    restart: always
    volumes:
      - ${MONITORING_MOUNT}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    expose:
      - "3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:3.0.0
    restart: always
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ${MONITORING_MOUNT}/loki:/loki
    ports:
      # Exposed on host so promtail on the app VM can push logs here.
      # Access restricted to the app VM by GCP firewall rule.
      - "3100:3100"
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
