server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Grafana — sub-path proxy (GF_SERVER_SERVE_FROM_SUB_PATH=true means Grafana
    # expects requests to arrive with the /grafana/ prefix intact)
    location /grafana/ {
        proxy_pass         http://grafana:3000/grafana/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Prometheus — protected by basic auth (Prometheus has no built-in auth).
    # --web.route-prefix=/ means Prometheus serves from /, so strip the prefix here.
    location /prometheus/ {
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/prometheus.htpasswd;

        proxy_pass         http://prometheus:9090/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Alertmanager — protected by the same basic auth credentials.
    location /alertmanager/ {
        auth_basic           "Prometheus";
        auth_basic_user_file /etc/nginx/prometheus.htpasswd;

        proxy_pass         http://alertmanager:9093/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
