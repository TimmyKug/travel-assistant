global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: travel-assistant-api
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
