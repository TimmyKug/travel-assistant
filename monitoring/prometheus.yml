# NOTE: This file is overwritten by Ansible during deployment.
# The canonical template is ansible/roles/monitoring_vm/templates/prometheus.yml.j2,
# which substitutes {{ gcp_project_id }} and {{ zone }} with real values.
#
# App VM targets use GCE service discovery (gce_sd_configs) so Prometheus
# automatically re-discovers the VM after MIG autohealing replaces it.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: travel-assistant

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  - job_name: travel-assistant-api
    gce_sd_configs:
      - project: GCP_PROJECT_ID
        zone:    GCP_ZONE
        filter:  'tags.items:travel-assistant'
    relabel_configs:
      - source_labels: [__meta_gce_private_ip]
        target_label:  __address__
        replacement:   '$1:80'
      - source_labels: [__meta_gce_instance_name]
        target_label:  instance
    metrics_path: /metrics

  - job_name: db-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    gce_sd_configs:
      - project: GCP_PROJECT_ID
        zone:    GCP_ZONE
        filter:  'tags.items:travel-assistant'
    relabel_configs:
      - source_labels: [__meta_gce_private_ip]
        target_label: __param_target
        replacement: http://$1/api/health/db
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__meta_gce_instance_name]
        target_label: instance

  - job_name: node-exporter-app
    gce_sd_configs:
      - project: GCP_PROJECT_ID
        zone:    GCP_ZONE
        filter:  'tags.items:travel-assistant'
    relabel_configs:
      - source_labels: [__meta_gce_private_ip]
        target_label:  __address__
        replacement:   '$1:9100'
      - source_labels: [__meta_gce_instance_name]
        target_label:  instance

  - job_name: node-exporter-monitoring
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
